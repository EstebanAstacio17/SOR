name: Build and Deploy to Azure App Service (SOR)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild Path
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore SOR/packages.config -PackagesDirectory packages

      - name: Build ASP.NET MVC Web Application
        run: |
          msbuild SOR/SOR.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:SkipInvalidConfigurations=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SOR'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'SOR/obj/Release/Package/PackageTmp'
